# EV Simulation Configuration
# This file contains all configurable parameters for the EV simulation

# Agent Configuration
agent:
  count: 1  # Default number of agents in the simulation
  battery:
    capacity: 100.0  # kWh
    low_threshold: 30.0  # %
    initial_min: 20.0  # %
    initial_max: 80.0  # %
  consumption_rate: 10.0  # kWh per km
  charging_rate: 30.0  # kWh per hour (fast charging)
  speed: 25.0  # km/h (average speed)
  schedule_offset_min: 0  # minutes
  schedule_offset_max: 0  # minutes
  
  # Agent state colors for visualization
  colors:
    at_home: 'green'
    at_office: 'blue'
    commuting: 'yellow'
    charging: 'purple'
    waiting: 'orange'
    low_battery: 'red'

# Allocation Algorithm Configuration
allocation:
  # Available algorithms:
  # - 'nearest': Simple nearest available station
  # - 'queue_time': Considers both distance and estimated queue time
  # - 'least_utilized': Prefers stations with more available ports
  # - 'cost_based': Considers charging cost, distance, and utilization
  # - 'ALL': Run all algorithms for comparison
  algorithm: 'nearest'  # Default algorithm
  
  # Algorithm-specific parameters
  parameters:
    # Parameters for queue_time algorithm
    queue_time:
      average_charging_time: 60  # minutes
      capacity_weight: 0.2  # Weight for capacity factor in scoring (0-1)
    
    # Parameters for cost_based algorithm
    cost_based:
      base_charging_rate: 0.15  # $/kWh
      travel_cost_per_km: 0.15  # $/km
      time_value: 0.2  # $/minute (value of time for waiting)
      utilization_penalty: 5.0  # Max $ penalty for high utilization

# Simulation Configuration
simulation:
  step_minutes: 10  # Simulation time step in minutes
  duration_days: 1  # Default simulation duration in days
  capture_interval_minutes: 30  # Time interval for capturing simulation states for animation
  
  # Time windows for commuting (in minutes from midnight)
  schedule:
    morning_commute_start: 480  # 8:00 AM
    morning_commute_window: 500  # max time to start
    evening_commute_start: 1020  # 5:00 PM
    evening_commute_window: 1040  # max time to start

# Charging Station Configuration
charging_station:
  default_ports: 1  # Default number of charging ports per station
  
  # Charging behavior
  min_charging_time: 60  # minutes
  target_charge_level: 80.0  # %

# Visualization Configuration
visualization:
  # Figure sizes
  network_figsize: [15, 7]  # Width, height in inches
  stats_figsize: [15, 10]  # Width, height in inches
  animation_figsize: [12, 10]  # Width, height in inches
  
  # Network visualization
  node_size: 10
  node_alpha: 0.5
  node_color: 'lightgray'
  edge_color: 'gray'
  edge_alpha: 0.5
  edge_width: 0.5
  
  # Station visualization
  station_size: 150
  station_color: 'red'
  station_marker: 's'
  
  # Home/Office visualization
  home_size: 80
  home_color: 'green'
  home_alpha: 0.7
  office_size: 120
  office_color: 'blue'
  office_alpha: 0.8
  
  # Animation settings
  animation_interval: 100  # ms between frames
  animation_fps: 1  # Frames per second for saved GIF
  
  # Static snapshots
  snapshot_times: [360, 540, 720, 1080, 1260]  # Times in minutes (6AM, 9AM, 12PM, 6PM, 9PM)
  snapshot_cols: 5  # Number of columns in snapshot grid

# File Paths
paths:
  roads: 'roads.geojson'
  charging_points: 'charging_points.geojson'
  network_visualization: './generatedFiles/network_visualization.png'
  simulation_results: './generatedFiles/simulation_results.png'
  animation_output: './generatedFiles/agent_movement_animation.gif'
  snapshots_output: './generatedFiles/simulation_snapshots.png'
  
  # Plot output files
  plots:
    agent_distribution: './generatedFiles/agent_distribution.png'
    battery_levels: './generatedFiles/battery_levels.png'
    low_battery_agents: './generatedFiles/low_battery_agents.png'
    charging_infrastructure: './generatedFiles/charging_infrastructure.png'
    timeDuration: 24
